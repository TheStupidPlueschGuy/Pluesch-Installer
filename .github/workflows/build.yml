name: Build Plüsch Studios Launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer für den öffentlichen Release (z.B. v1.0.0) - nur ausfüllen, wenn wirklich veröffentlicht werden soll'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhängigkeiten installieren
        run: pip install flask pywebview pythonnet pyinstaller
      - name: Versionsdatei schreiben
        run: |
          $v = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "dev" }
          Set-Content -Path version.txt -Value $v -NoNewline -Encoding utf8
      - name: EXE bauen (onefile, ohne UPX)
        run: |
          pyinstaller --onefile --noupx --noconsole `
            --name "Plüsch Studios Launcher" `
            --add-data "templates;templates" `
            --add-data "version.txt;." `
            app.py
      - name: EXE als Artifact hochladen (privat, nur zum Testen)
        uses: actions/upload-artifact@v4
        with:
          name: Pluesch_Studios_Launcher_Windows
          path: "dist/Plüsch Studios Launcher.exe"
      - name: Öffentlichen Release veröffentlichen
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # Eigenes Release-Repo fürs Installer-Projekt, getrennt von plueschi-releases (PDL) -
          # NICHT dasselbe Repo wie PDL verwenden: /releases/latest liefert sonst mal den
          # PDL-, mal den Launcher-Release und macht beiden Update-Checks die Versions-
          # vergleiche kaputt. Name muss exakt zu LAUNCHER_RELEASES_API in app.py passen.
          repository: TheStupidPlueschGuy/Pluesch-Installer-releases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          tag_name: ${{ inputs.version }}
          name: "Plüsch Studios Launcher ${{ inputs.version }}"
          files: "dist/Plüsch Studios Launcher.exe"
